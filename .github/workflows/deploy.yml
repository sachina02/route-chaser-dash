name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (prerenders every route to static HTML)
        run: npm run build

      - name: Prepare Pages artifact
        run: |
          set -e
          if [ -d ".output/public" ]; then
            cp -r .output/public ./_site
          elif [ -d "dist/client" ]; then
            cp -r dist/client ./_site
          else
            cp -r dist ./_site
          fi
          # SPA-style fallback so deep links work on GitHub Pages
          cp ./_site/index.html ./_site/404.html
          touch ./_site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
